# user-management 前端静态托管配置（生产）
# 前端构建产物是纯静态文件，Nginx 只负责把它们发出去 + 处理 SPA 路由回退。

server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # 开启 gzip，压缩文本类资源，减小传输体积
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 带 hash 的静态资源（/assets/index-xxxx.js）可长期强缓存：
  # 内容变了文件名的 hash 就变，URL 自然失效，所以可以放心缓存一年。
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA history 回退（关键！）：
  # 直接访问 /users/1 这种前端路由时，磁盘上并没有这个文件，
  # try_files 先找真实文件/目录，找不到就返回 index.html，
  # 交给浏览器里的 React Router 决定渲染哪个页面。
  # 没有这条，深链接刷新就会 404。
  location / {
    try_files $uri $uri/ /index.html;
  }
}
